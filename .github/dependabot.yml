# Monthly, few at a time. Dependabot opens pull requests; merge them or close them as you like.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
