name: CI Quality Gates & Pages Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Authorize production release to 258webco.com (indexable)'
        required: true
        type: boolean
        default: false
      accept_enquiries:
        description: 'Accept enquiries: switch the contact form on and open /api/contact'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          pip install --quiet -r requirements-dev.txt

      - name: Setup Dart Sass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/setup.py

      - name: Build Safe Verification Baseline
        run: |
          rm -rf public
          python3 scripts/build.py

      - name: Verify Static & Unit Quality Gates
        run: |
          python3 scripts/check_site.py public
          python3 scripts/test_factory.py
          python3 scripts/test_starter.py
          python3 scripts/test_from_plan.py
          python3 scripts/test_enquiries.py
          python3 scripts/test_schemas.py
          python3 scripts/test_claims.py
          python3 scripts/schemas.py --check
          python3 scripts/claims.py --strict
          python3 scripts/test_ai.py
          python3 scripts/test_mcp.py
          python3 scripts/test_evals.py
          python3 scripts/test_handover.py
          python3 scripts/test_library.py
          python3 scripts/test_links.py
          python3 scripts/contrast.py
          node scripts/visual_check.cjs --self-test
          node scripts/test_contact_endpoint.mjs

      - name: Lint Python and JavaScript
        run: npm run -s lint

      - name: Verify Enabled Form & Pages Local KV Integration Gate
        run: sh scripts/check_contact.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Internal Workshop
        run: python3 scripts/build.py --workshop

      - name: Verify Browser Accessibility, Layout & CSP Gates
        run: |
          node scripts/browser-checks.cjs
          node scripts/check_workshop.cjs
          node scripts/check_components.cjs
          node scripts/check_workflow.cjs

  deploy:
    name: Publish Production Release (Owner Authorized)
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer release waits for the running one instead of racing it to Cloudflare.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Dart Sass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/setup.py

      # The form and the endpoint are switched on together or not at all. wrangler.toml is the
      # only source of Pages variables, so a form built "on" against ENQUIRY_ENABLED = "false"
      # would refuse every visitor. The committed file stays "false"; only this checkout changes.
      - name: Set Enquiry Intake
        env:
          ACCEPT: ${{ inputs.accept_enquiries }}
        run: |
          if [ "$ACCEPT" = "true" ]; then
            sed -i 's/^ENQUIRY_ENABLED = "false"$/ENQUIRY_ENABLED = "true"/' wrangler.toml
            echo "HUGO_PARAMS_FORMENABLED=true" >> "$GITHUB_ENV"
          else
            echo "HUGO_PARAMS_FORMENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Check Form and Endpoint Agree
        run: |
          if ! grep -q "^ENQUIRY_ENABLED = \"$HUGO_PARAMS_FORMENABLED\"$" wrangler.toml; then
            echo "::error::The form is '$HUGO_PARAMS_FORMENABLED' but wrangler.toml does not set ENQUIRY_ENABLED to match."
            exit 1
          fi

      - name: Build Production Site (258webco)
        run: |
          rm -rf public
          HUGO_PARAMS_NOINDEX=false python3 scripts/build.py --base-url https://258webco.com/

      - name: Verify Production Output
        run: |
          HUGO_PARAMS_NOINDEX=false python3 scripts/check_site.py public
          if grep -q 'data-enabled=true' public/contact/index.html; then built=true; else built=false; fi
          if [ "$built" != "$HUGO_PARAMS_FORMENABLED" ]; then
            echo "::error::The contact form was built with delivery '$built', expected '$HUGO_PARAMS_FORMENABLED'."
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=258webco