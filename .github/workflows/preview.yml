name: Preview Deployment

# Manual only. Publishes a checked preview to a Cloudflare Pages preview alias, never to
# production: https://preview-site.258webco.pages.dev or https://preview-workshop.258webco.pages.dev.
# Previews always keep noindex on and the contact form off. Anyone with the link can open
# them; protect *.258webco.pages.dev with Cloudflare Access if the workshop must stay private.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to preview'
        required: true
        type: choice
        options:
          - site
          - workshop
        default: site

concurrency:
  group: preview-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build, Check, and Publish Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup Dart Sass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/setup.py

      - name: Build Preview (noindex, form off)
        env:
          TARGET: ${{ inputs.target }}
        run: |
          rm -rf public public-workshop
          if [ "$TARGET" = "workshop" ]; then
            HUGO_PARAMS_NOINDEX=true HUGO_PARAMS_FORMENABLED=false python3 scripts/build.py --workshop
            echo "OUTPUT=public-workshop" >> "$GITHUB_ENV"
          else
            HUGO_PARAMS_NOINDEX=true HUGO_PARAMS_FORMENABLED=false python3 scripts/build.py
            echo "OUTPUT=public" >> "$GITHUB_ENV"
          fi

      - name: Verify Preview Output
        run: |
          HUGO_PARAMS_NOINDEX=true python3 scripts/check_site.py "$OUTPUT"
          if grep -rq 'data-enabled=true' "$OUTPUT" --include=index.html; then
            echo "::error::A preview must never be built with the contact form on."
            exit 1
          fi

      - name: Publish to Preview Alias
        id: publish
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Wrangler that scripts/check_contact.sh tests; keep the two in step. The action's own default is older.
          wranglerVersion: "4.136.2"
          command: pages deploy ${{ env.OUTPUT }} --project-name=258webco --branch=preview-${{ inputs.target }}

      # Read-only checks of what was just published, including that static/_routes.json still
      # sends the private build files through the middleware (404). The deployment's own URL is
      # checked, not the alias, which can briefly serve the previous upload.
      - name: Smoke Check Preview
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ -z "$URL" ]; then echo "::error::wrangler-action reported no deployment URL."; exit 1; fi
          if [ "$TARGET" = "workshop" ]; then FORM=any; else FORM=off; fi
          python3 scripts/smoke.py "${URL%/}" --noindex --form "$FORM"
