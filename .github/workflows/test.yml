name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Dart Sass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/setup.py

      - name: Build Site (Production settings)
        run: |
          HUGO_PARAMS_FORMENABLED=true HUGO_PARAMS_NOINDEX=false \
            python3 scripts/build.py --base-url https://258webco.com/

      - name: Run Checks and Tests
        run: |
          HUGO_PARAMS_NOINDEX=false python3 scripts/check_site.py public
          python3 scripts/test_factory.py
          python3 scripts/test_starter.py
          python3 scripts/test_from_plan.py
          node scripts/test_contact_endpoint.mjs
