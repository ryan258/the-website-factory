- question: "How long does a website take?"
  answer: "A focused landing page typically takes two to three weeks. A five-page site is usually three to five weeks after content and scope are agreed. These are sample timelines, not a delivery guarantee."

- question: "What do you need from us?"
  answer: "Your goals, existing brand assets, and a first draft of your content. We start with a short brief and identify any gaps before design begins."

- question: "Can you improve our existing website?"
  answer: "Yes. We can start with a speed and content review, then recommend a focused update or a rebuild based on what we find."

- question: "Will we be able to edit the site?"
  answer: "Content is stored in plain text and structured data files. This sample project has no CMS; an editing workflow would be agreed before a real build."

- question: "What happens after launch?"
  answer: "You receive the site source and a handover guide. Hosting, maintenance, and future updates are separately scoped so responsibilities stay clear."

- question: "Do you guarantee a perfect speed score?"
  answer: "No. We build against a small performance budget and test the result. The hosting environment, content, and later changes can affect scores."
