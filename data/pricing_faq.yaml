- question: "When would payment be due?"
  answer: "A sample arrangement is 50% to begin and 50% at handover. Any real payment terms would be confirmed in a written proposal."
- question: "When does the timeline start?"
  answer: "After scope, content, and the initial payment are agreed. Feedback delays or additional pages can change the schedule."
- question: "What costs are separate?"
  answer: "Domain registration, hosting, ongoing care, and new work outside the agreed scope. We would list each separately before you proceed."
