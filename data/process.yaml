- title: "Brief"
  description: "Get the right plan on paper."
  detail: "We agree on your audience, pages, content, and the one action your website needs to support."

- title: "Design"
  description: "Make every detail earn its place."
  detail: "We establish the visual direction and review the core page layouts before writing templates."

- title: "Build"
  description: "Less weight. More purpose."
  detail: "We build reusable components, optimize assets, and check mobile layouts and keyboard access."

- title: "Launch"
  description: "Check it. Ship it. Hand it over."
  detail: "After owner approval, we verify forms and performance on the host, then provide a practical handover."
