<div class="factory" aria-hidden="true">
<div class="factory__label">
<span>{{ upper hugo.Data.site.wordmark }}</span>
</div>
<div class="factory__orbit">
</div>
<div class="browser-card">
<div class="browser-card__chrome">
<span>● ● ●</span>
<span>{{ hugo.Data.site.wordmark }} ↗</span>
</div>
<div class="browser-card__canvas">
<div class="browser-card__brand">{{ hugo.Data.site.tagline }}</div>
<div class="browser-card__headline">{{ hugo.Data.site.wordmark }}</div>
<div class="browser-card__line">
</div>
<div class="browser-card__line browser-card__line--short">
</div>
<div class="browser-card__button">{{ hugo.Data.site.primary_cta.label }} ↗</div>
<div class="browser-card__shape">
</div>
</div>
</div>
<div class="factory__stamp">
<span aria-hidden="true">↗</span>
<strong>{{ hugo.Data.site.footer_cta | default hugo.Data.site.wordmark }}</strong>
</div>
<div class="factory__rail">
<span>01 BRIEF</span>
<span>02 DESIGN</span>
<span>03 BUILD</span>
<span>04 LAUNCH ↗</span>
</div>
</div>
