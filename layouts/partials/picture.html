{{ $img := resources.Get .Params.image }}{{ $small := $img.Resize "560x webp q80" }}{{ $large := $img.Resize "1120x webp q80" }}{{ $fallback := $img.Resize "560x jpg q80" }}<picture>
<source type="image/webp" srcset="{{ $small.RelPermalink }} 560w, {{ $large.RelPermalink }} 1120w" sizes="(min-width: 900px) 544px, 100vw">
<img src="{{ $fallback.RelPermalink }}" width="{{ $fallback.Width }}" height="{{ $fallback.Height }}" alt="{{ .Params.alt }}" loading="lazy" decoding="async">
</picture>
