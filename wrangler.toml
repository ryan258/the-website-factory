name = "258webco"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

# --- Contact form delivery -------------------------------------------------
# /api/contact needs somewhere to put an enquiry (the KV namespace below, or a
# NOTIFICATION_WEBHOOK secret) AND an explicit ENQUIRY_ENABLED = "true". Missing
# either, it returns 503 and the site is a preview that cannot receive mail.
# docs/cloudflare-setup.md walks through filling these in.

# Where enquiries are stored. Create with: npx wrangler kv namespace create ENQUIRY
[[kv_namespaces]]
binding = "ENQUIRY"
id = "ea6f0db631da4aaeb78c786a4581214c"

# Notifications: Pages Functions cannot bind send_email (only Workers can), so there is
# no email path. For alerts, add a NOTIFICATION_WEBHOOK secret on the Pages project.

# Intake is deliberate, not a side effect of the bindings above: /api/contact refuses
# every submission unless the deployment sets ENQUIRY_ENABLED to "true". A copy of this
# project starts without it, so an inherited namespace can never receive its enquiries.
# Keep "false" here. The production workflow (.github/workflows/deploy.yml) sets it to
# "true" in its own checkout only when the owner ticks "Accept enquiries", and builds the
# form switched on in the same step, so the form and the endpoint always agree.
[vars]
ENQUIRY_ENABLED = "false"

# --- Building --------------------------------------------------------------
# Preferred: build locally, where the Hugo and Dart Sass pins are verified, then
# upload the checked output with `npx wrangler pages deploy`.
#
# If you connect a Git repository and let Cloudflare build instead:
#   Build command:    python3 scripts/setup.py && python3 scripts/build.py --base-url "$CF_PAGES_URL/"
#   Output directory: public
#   HUGO_VERSION=0.166.0  DART_SASS_VERSION=1.104.1  HUGO_ENVIRONMENT=production
# Python and pip are preinstalled on the Pages build image, and setup.py fetches
# Dart Sass for linux-x64. build.py fails loudly if that image's Hugo is not the
# Extended build, so a bad image is a failed deploy rather than broken styling.
